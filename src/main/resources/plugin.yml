name: SetLobbySpawn
version: '1.0'
main: com.setlobbyspawn.SetLobbySpawn
# 最低 api-version：1.13+ 服务器均接受；1.8-1.12 服务端会自动忽略此字段
api-version: '1.13'
author: SetLobbySpawn
description: 简单的全服出生点与入服欢迎插件（兼容 Paper/Spigot 1.8+）
commands:
  sls:
    description: SetLobbySpawn 主指令
    usage: /sls <help|spawn|saywelcome|welcometitle|reload>
permissions:
  setlobbyspawn.admin:
    description: 允许使用 /sls 的全部设置指令
    default: op
