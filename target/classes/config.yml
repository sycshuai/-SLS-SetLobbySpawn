# ============================================
#  SetLobbySpawn 配置文件
#  修改后执行 /sls reload 立即生效
# ============================================

# 全服出生点设置
spawn:
  # true : 每次入服、死亡后都回到此出生点
  # false: 仅第一次入服时出生在此
  enabled: true
  # 出生点世界与坐标（也可用 /sls spawn <true|false> 站在出生点直接设置）
  world: world
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# 入服欢迎语（最多5行，支持 & 颜色符，留空或删除的行不显示）
welcome:
  lines:
    - "&6欢迎来到本服务器！"
    - "&e输入 /sls help 查看指令帮助"

# 入服欢迎标题（最多5行，支持 & 颜色符，留空或删除的行不显示）
# 第1行为主标题(最大)，第2行为副标题(较小)，第3-5行合并显示在副标题中(依次更小)
welcome-title:
  lines:
    - "&6欢迎加入"
    - "&eWelcome!"
